<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiper Carousel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .swiper-button-next,
        .swiper-button-prev {
            color: white; /* Arrow color */
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
        }

        .swiper-button-next {
            right: 10px; /* Adjust arrow position */
        }

        .swiper-button-prev {
            left: 10px; /* Adjust arrow position */
        }
    </style>
</head>
<body class="bg-gray-100 ">

<div class="container pb-10 max-w-xl mx-auto overflow-hidden ">
    <div class="swiper-container relative">
        <div class="swiper-wrapper">
            {% for item in carousel_items %}
            <div class="swiper-slide w-3/4 h-1/3">
                <div class="p-1">
                    <div class="relative aspect-w-16 aspect-h-6 bg-gray-200 overflow-hidden rounded-xl">
                        <div class="absolute inset-0 bg-gradient-to-r from-black/60 to-transparent z-10 flex flex-col justify-center px-10">
                            <h2 class="text-3xl font-bold text-white mb-2">{{ item.title }}</h2>
                            <p class="text-white/90 mb-4">{{ item.subtitle }}</p>
                            <a href="#" class="text-white bg-blue-500 py-2 px-4 rounded-md w-fit">Shop Now</a>
                        </div>
                        <img src="{{ item.image_url }}" alt="{{ item.title }}" class="object-cover w-full h-full" />
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
    // Initialize Swiper for Carousel
    var swiper = new Swiper('.swiper-container', {
        loop: true,
        navigation: {
            nextEl: '.swiper-button-next',
            prevEl: '.swiper-button-prev',
        },
        autoplay: {
            delay: 5000,
        },
        pagination: {
            el: '.swiper-pagination',
            clickable: true,
        },
    });
</script>

</body>
</html>
