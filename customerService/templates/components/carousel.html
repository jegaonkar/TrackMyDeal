<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<div class="swiper-slide w-3/4 h-1/2">
    <div class="container pb-10 max-w-3x1">
        <div class="swiper-container">
            <div class="swiper-wrapper">
                {% for item in carousel_items %}
                <div class="swiper-slide">
                    <div class="p-1">
                        <div class="relative aspect-w-16 aspect-h-6 bg-muted overflow-hidden rounded-xl">
                            <div class="absolute inset-0 bg-gradient-to-r from-black/60 to-transparent z-10 flex flex-col justify-center px-10">
                                <h2 class="text-3xl font-bold text-white mb-2">{{ item.title }}</h2>
                                <p class="text-white/90 mb-4">{{ item.subtitle }}</p>
                                <a href="#" class="text-white bg-blue-500 py-2 px-4 rounded-md">Shop Now</a>
                            </div>
                            <img src="{{ item.image_url }}" alt="{{ item.title }}" class="object-cover w-full h-full" />
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
    
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
    // Initialize Swiper for Carousel
    var swiper = new Swiper('.swiper-container', {
        loop: true,
        navigation: {
            nextEl: '.swiper-button-next',
            prevEl: '.swiper-button-prev',
        },
    });
</script>
