
<section class="mt-16 lg:px-10 xl:px-20">
    <h2 class="text-2xl font-semibold mb-8 text-center text-gray-100">
        Popular Deals
    </h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {% for deal in popular_deals %}
            <div class="bg-gray-100 p-6 rounded-lg shadow-md hover:shadow-lg transition duration-300 transform hover:-translate-y-1 w-full">
                <img src="{{ deal.image_url }}" alt="{{ deal.name }}" class="w-full h-40 object-cover mb-4 rounded">
                <h3 class="text-xl font-semibold text-gray-800 mb-2">{{ deal.name }}</h3>
                <p class="text-gray-600 mb-4">{{ deal.price }}</p>
                <a href="{{ deal.link }}" class="w-full bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 transition duration-300 text-center block">
                    Shop Now
                </a>
            </div>
        {% endfor %}
    </div>
</section>
